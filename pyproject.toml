[project]
name = "openmaskit-companion"
version = "0.1.0a1"
description = "Native macOS desktop manager for OpenMaskit"
classifiers = ["Operating System :: MacOS :: MacOS X"]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "openmaskit-connector==0.1.0a1",
    "httpx>=0.28,<1",
]

[project.scripts]
openmaskit-companion = "openmaskit_companion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hatchling>=1.27,<2",
    "pip-audit>=2.10.1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=7.1.0",
    "respx>=0.22,<1",
    "ruff>=0.17.1",
]
bundle = ["pyinstaller>=6.16,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/openmaskit_companion"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.uv.sources]
openmaskit-connector = { git = "https://github.com/ricardomartins-gravitee/openmaskit-connector.git", rev = "2cb467101036faf4141c44074fcc3c8e0b03d100" }
