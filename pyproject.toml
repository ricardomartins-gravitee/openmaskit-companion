[project]
name = "openmaskit-companion"
version = "0.1.0a1"
description = "Desktop manager and outbound local MCP connector for OpenMaskit"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["mcp>=1.27,<2", "starlette>=0.49,<1", "uvicorn[standard]>=0.38,<1", "httpx>=0.28,<1", "websockets>=15,<17", "pydantic>=2.12,<3"]

[project.scripts]
openmaskit-companion = "openmaskit_companion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "respx>=0.22,<1"]
bundle = ["pyinstaller>=6.16,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
