# SonarQube Cloud project and organization keys are supplied by repository
# variables in .github/workflows/sonarqube.yml after Cloud onboarding.
sonar.sources=src,desktop/macos/Sources
sonar.tests=tests,desktop/macos/Tests
sonar.test.inclusions=tests/**/*.py,desktop/macos/Tests/**/*.swift
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12
