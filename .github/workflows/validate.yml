name: Validate and package companion
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  security:
    uses: ./.github/workflows/security.yml

  intel-wheel:
    needs: [quality, security]
    permissions:
      contents: read
      attestations: read
      actions: read
    uses: ricardomartins-gravitee/openmaskit-connector/.github/workflows/intel-wheel.yml@56d88cd5c97d7428760abadbd9d1511c1f8db972
    with:
      source-ref: 56d88cd5c97d7428760abadbd9d1511c1f8db972

  integration:
    needs: [quality, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ricardomartins-gravitee/openmaskit-connector
          ref: 56d88cd5c97d7428760abadbd9d1511c1f8db972
          path: .runtime/connector-source
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: uv sync --frozen --no-build --python 3.12 --group dev --no-install-package openmaskit-connector
      - name: Install the reviewed connector source from its verified wheel
        run: uv run --frozen --no-sync --no-build python scripts/install_connector.py
      - name: Exercise the exact pinned connector dependency
        working-directory: .runtime/connector-source
        run: ../../.venv/bin/python -m pytest tests -q --junitxml=../pinned-connector-tests.xml --cov=openmaskit_connector --cov-branch --cov-report=xml:../pinned-connector-coverage.xml
      - name: Retain pinned connector regression results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pinned-connector-regressions
          path: |
            .runtime/pinned-connector-tests.xml
            .runtime/pinned-connector-coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Build the pinned connector relay image for local acceptance
        run: docker buildx build --load --provenance=false --pull --tag openmaskit-connector:candidate .runtime/connector-source
      - name: Exercise the companion manager against an isolated candidate relay
        run: uv run --frozen --no-sync --no-build python scripts/manager_acceptance.py --candidate-image openmaskit-connector:candidate

  native:
    needs: [quality, security]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Swift sources and tests
        run: swift format lint --strict --recursive desktop/macos/Sources desktop/macos/Tests desktop/macos/Package.swift
      - name: Run Swift tests
        run: |
          status=0
          swift test --package-path desktop/macos --enable-code-coverage || status=$?
          mkdir -p .runtime/native-coverage
          report="$(swift test --package-path desktop/macos --show-codecov-path)"
          if [ -f "$report" ]; then cp "$report" .runtime/native-coverage/coverage.json; fi
          exit "$status"
        env:
          COMPANION_SNAPSHOT_DIR: ${{ github.workspace }}/.runtime/native-ui-snapshots
      - name: Retain native coverage and synthetic screen snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ui-and-coverage-${{ matrix.os }}
          path: |
            .runtime/native-coverage/
            .runtime/native-ui-snapshots/
          if-no-files-found: error
          retention-days: 14

  package-test:
    needs: [intel-wheel, integration, native]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ricardomartins-gravitee/openmaskit-connector
          ref: 56d88cd5c97d7428760abadbd9d1511c1f8db972
          path: .runtime/connector-source
      - if: matrix.os != 'macos-15-intel'
        run: uv sync --frozen --no-build --python 3.12 --group dev --group bundle --no-install-package openmaskit-connector
      - if: matrix.os == 'macos-15-intel'
        name: Install app bundle tools without cryptography
        run: uv sync --frozen --no-build --python 3.12 --group dev --group bundle --no-install-package cryptography --no-install-package openmaskit-connector
      - name: Install the reviewed connector source from its verified wheel
        run: uv run --frozen --no-sync --no-build python scripts/install_connector.py
      - if: matrix.os == 'macos-15-intel'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intel-cryptography-wheel
          path: ${{ runner.temp }}/intel-wheel
      - if: matrix.os == 'macos-15-intel'
        name: Verify and install the connector's same-run Intel wheel
        run: |
          uv run --frozen --no-sync --no-build python .runtime/connector-source/scripts/intel_wheel.py prepare "$RUNNER_TEMP/intel-wheel"
          uv pip install --python .venv/bin/python --no-deps --no-build --require-hashes --requirement "$RUNNER_TEMP/intel-wheel/install.txt"
          uv run --frozen --no-sync --no-build python .runtime/connector-source/scripts/test_crypto.py
      - run: uv run --frozen --no-sync --no-build pytest -q
      - name: Run native process and startup acceptance
        run: uv run --frozen --no-sync --no-build python scripts/test_macos_desktop.py
      - name: Build the companion app with the pinned connector
        run: uv run --frozen --no-sync --no-build python scripts/bundle.py
      - name: Exercise the bundled connector backend contract
        run: uv run --frozen --no-sync --no-build python scripts/test_bundle.py

  test:
    if: always()
    needs: [native, package-test]
    strategy:
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every native and packaging matrix job to pass
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          PACKAGE_RESULT: ${{ needs.package-test.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$PACKAGE_RESULT" = success

  release-metadata:
    if: github.repository == 'ricardomartins-gravitee/openmaskit-companion' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, integration, quality, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
      actions: read
    outputs:
      relay-image: ${{ steps.release.outputs.relay-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uv sync --frozen --no-build --python 3.12 --group dev --no-install-package openmaskit-connector
      - name: Verify the connector release pinned to this companion build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --no-sync --no-build python scripts/connector_release.py

  package:
    if: github.repository == 'ricardomartins-gravitee/openmaskit-companion' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, intel-wheel, release-metadata]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      RELAY_IMAGE: ${{ needs.release-metadata.outputs.relay-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - if: matrix.os != 'macos-15-intel'
        run: uv sync --frozen --no-build --python 3.12 --group dev --group bundle --no-install-package openmaskit-connector
      - if: matrix.os == 'macos-15-intel'
        name: Install app bundle tools without cryptography
        run: uv sync --frozen --no-build --python 3.12 --group dev --group bundle --no-install-package cryptography --no-install-package openmaskit-connector
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ricardomartins-gravitee/openmaskit-connector
          ref: 56d88cd5c97d7428760abadbd9d1511c1f8db972
          path: .runtime/connector-source
      - name: Install the reviewed connector source from its verified wheel
        run: uv run --frozen --no-sync --no-build python scripts/install_connector.py
      - if: matrix.os == 'macos-15-intel'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intel-cryptography-wheel
          path: ${{ runner.temp }}/intel-wheel
      - if: matrix.os == 'macos-15-intel'
        name: Verify and install the connector's same-run Intel wheel
        run: |
          uv run --frozen --no-sync --no-build python .runtime/connector-source/scripts/intel_wheel.py prepare "$RUNNER_TEMP/intel-wheel"
          uv pip install --python .venv/bin/python --no-deps --no-build --require-hashes --requirement "$RUNNER_TEMP/intel-wheel/install.txt"
          uv run --frozen --no-sync --no-build python .runtime/connector-source/scripts/test_crypto.py
      - name: Build the companion app with the verified relay image
        run: uv run --frozen --no-sync --no-build python scripts/bundle.py --image "$RELAY_IMAGE"
      - name: Exercise the bundled connector backend contract
        run: uv run --frozen --no-sync --no-build python scripts/test_bundle.py
      - name: Archive the tested macOS app
        run: uv run --frozen --no-sync --no-build python scripts/archive.py
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/downloads/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-${{ matrix.os }}
          path: dist/downloads/*
          retention-days: 14
