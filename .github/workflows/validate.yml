name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
  actions: read
concurrency:
  group: companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  security:
    uses: ./.github/workflows/security.yml

  intel-wheel:
    needs: [quality, security]
    uses: ./.github/workflows/intel-wheel.yml

  test:
    needs: intel-wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - if: matrix.os != 'macos-15-intel'
        run: uv sync --frozen --no-build --python 3.12 --group dev
      - if: matrix.os == 'macos-15-intel'
        name: Install binary dependencies without cryptography
        run: uv sync --frozen --no-build --python 3.12 --group dev --group bundle --no-install-package cryptography
      - if: matrix.os == 'macos-15-intel'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intel-cryptography-wheel
          path: ${{ runner.temp }}/intel-wheel
      - if: matrix.os == 'macos-15-intel'
        name: Verify and install the same-run Intel wheel
        run: |
          uv run --frozen --no-sync --no-build python scripts/intel_wheel.py prepare "$RUNNER_TEMP/intel-wheel"
          uv pip install --python .venv/bin/python --no-deps --no-build --require-hashes --requirement "$RUNNER_TEMP/intel-wheel/install.txt"
          uv run --frozen --no-sync --no-build python scripts/test_crypto.py
      - run: uv run --frozen --no-sync --no-build pytest -q
      - if: runner.os == 'macOS'
        name: Lint Swift sources and tests
        run: swift format lint --strict --recursive desktop/macos/Sources desktop/macos/Tests desktop/macos/Package.swift
      - if: runner.os == 'macOS'
        run: swift test --package-path desktop/macos
      - if: matrix.os == 'macos-15-intel'
        name: Build an Intel development app with the verified wheel before merge
        run: uv run --frozen --no-sync --no-build python scripts/bundle.py
      - if: matrix.os == 'macos-15-intel'
        name: Exercise the packaged Intel connector before merge
        run: uv run --frozen --no-sync --no-build python scripts/test_bundle.py

  image:
    needs: [quality, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: uv sync --frozen --no-build --python 3.12 --group dev
      - name: Build native image
        run: docker buildx build --load --provenance=false --pull --tag openmaskit-companion:candidate .
      - name: Scan the actual image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: openmaskit-companion:candidate
          version: v0.70.0
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/trivy-image.json
          hide-progress: 'true'
          timeout: 10m
      - name: Print redacted image scan summary
        if: always()
        run: python3 scripts/security_report.py "${{ runner.temp }}/trivy-image.json"
      - name: Real OpenMaskit, Presidio and host MCP acceptance
        run: uv run --frozen --no-sync --no-build python scripts/container_acceptance.py --image openmaskit-companion:candidate
      - name: Save tested image
        if: github.event_name != 'pull_request'
        run: docker save openmaskit-companion:candidate | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: image-${{ matrix.arch }}
          path: image.tar.gz
          retention-days: 3

  native-release:
    if: github.repository == 'ricardomartins-gravitee/openmaskit-companion' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, image, quality, security, intel-wheel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: native-intel-release-${{ needs.intel-wheel.outputs.build-key }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uv sync --frozen --no-build --python 3.12 --only-group intel-build
      - name: Verify an existing dependency release before deciding to publish
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --no-sync --no-build python scripts/intel_wheel.py restore-release "$RUNNER_TEMP/existing-native-library"
      - if: steps.existing.outputs.reused != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intel-cryptography-wheel
          path: ${{ runner.temp }}/intel-wheel
      - if: steps.existing.outputs.reused != 'true'
        name: Archive the verified dependency bundle
        run: uv run --frozen --no-sync --no-build python scripts/intel_wheel.py archive "$RUNNER_TEMP/intel-wheel"
      - if: steps.existing.outputs.reused != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/intel-native-library.zip
      - if: steps.existing.outputs.reused != 'true'
        name: Publish the content-addressed native dependency release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_KEY: ${{ needs.intel-wheel.outputs.build-key }}
        run: |
          gh release create "native-intel-$BUILD_KEY" "$RUNNER_TEMP/intel-native-library.zip" \
            --repo ricardomartins-gravitee/openmaskit-companion --target "$GITHUB_SHA" \
            --prerelease --title "Intel native dependency $BUILD_KEY" \
            --notes-file docs/native-dependency-release.md

  publish:
    if: github.repository == 'ricardomartins-gravitee/openmaskit-companion' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, image, quality, security, intel-wheel]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Publish only the tested images
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=ghcr.io/ricardomartins-gravitee/openmaskit-companion
          for arch in amd64 arm64; do
            gzip -dc "image-$arch/image.tar.gz" | docker load
            docker tag openmaskit-companion:candidate "$image:sha-$SOURCE_SHA-$arch"
            docker push "$image:sha-$SOURCE_SHA-$arch"
          done
          if ! docker buildx imagetools inspect "$image:sha-$SOURCE_SHA" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "$image:sha-$SOURCE_SHA" "$image:sha-$SOURCE_SHA-amd64" "$image:sha-$SOURCE_SHA-arm64"
          fi
          digest=$(docker buildx imagetools inspect "$image:sha-$SOURCE_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Tested relay image: \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/ricardomartins-gravitee/openmaskit-companion
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  package:
    needs: [publish, native-release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - if: matrix.os != 'macos-15-intel'
        run: uv sync --frozen --no-build --python 3.12 --group dev --group bundle
      - if: matrix.os == 'macos-15-intel'
        name: Install binary build dependencies without cryptography
        run: uv sync --frozen --no-build --python 3.12 --group dev --group bundle --no-install-package cryptography
      - if: matrix.os == 'macos-15-intel'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intel-cryptography-wheel
          path: ${{ runner.temp }}/intel-wheel
      - if: matrix.os == 'macos-15-intel'
        name: Verify and install the same-run Intel wheel
        run: |
          uv run --frozen --no-sync --no-build python scripts/intel_wheel.py prepare "$RUNNER_TEMP/intel-wheel"
          uv pip install --python .venv/bin/python --no-deps --no-build --require-hashes --requirement "$RUNNER_TEMP/intel-wheel/install.txt"
          uv run --frozen --no-sync --no-build python scripts/test_crypto.py
      - name: Exercise actual managed installation lifecycle
        if: runner.os == 'Linux'
        env:
          RELAY_IMAGE: ${{ needs.publish.outputs.image }}
        run: uv run --frozen --no-sync --no-build python scripts/manager_acceptance.py --image "$RELAY_IMAGE"
      - name: Build development download
        env:
          RELAY_IMAGE: ${{ needs.publish.outputs.image }}
        run: uv run --frozen --no-sync --no-build python scripts/bundle.py --image "$env:RELAY_IMAGE"
        if: runner.os == 'Windows'
      - name: Build development download
        env:
          RELAY_IMAGE: ${{ needs.publish.outputs.image }}
        run: uv run --frozen --no-sync --no-build python scripts/bundle.py --image "$RELAY_IMAGE"
        if: runner.os != 'Windows'
      - name: Exercise the bundled connector
        run: uv run --frozen --no-sync --no-build python scripts/test_bundle.py
      - name: Archive development downloads and checksums
        run: uv run --frozen --no-sync --no-build python scripts/archive.py
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/downloads/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-${{ matrix.os }}
          path: dist/downloads/*
          retention-days: 14
