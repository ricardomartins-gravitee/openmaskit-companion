name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: '0.13.1'
      - run: uv sync --frozen --python 3.12 --group dev
      - run: uv run --frozen pytest -q
      - if: runner.os == 'macOS'
        run: swift build --package-path desktop/macos

  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: '0.13.1'
      - uses: docker/setup-buildx-action@v3
      - run: uv sync --frozen --python 3.12 --group dev
      - name: Build native image
        run: docker buildx build --load --provenance=false --pull --tag openmaskit-companion:candidate .
      - name: Real OpenMaskit, Presidio and host MCP acceptance
        run: uv run --frozen python scripts/container_acceptance.py --image openmaskit-companion:candidate
      - name: Save tested image
        if: github.event_name != 'pull_request'
        run: docker save openmaskit-companion:candidate | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image-${{ matrix.arch }}
          path: image.tar.gz
          retention-days: 3

  publish:
    if: github.repository == 'ricardomartins-gravitee/openmaskit-companion' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Publish only the tested images
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=ghcr.io/ricardomartins-gravitee/openmaskit-companion
          for arch in amd64 arm64; do
            gzip -dc "image-$arch/image.tar.gz" | docker load
            docker tag openmaskit-companion:candidate "$image:sha-$SOURCE_SHA-$arch"
            docker push "$image:sha-$SOURCE_SHA-$arch"
          done
          if ! docker buildx imagetools inspect "$image:sha-$SOURCE_SHA" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "$image:sha-$SOURCE_SHA" "$image:sha-$SOURCE_SHA-amd64" "$image:sha-$SOURCE_SHA-arm64"
          fi
          digest=$(docker buildx imagetools inspect "$image:sha-$SOURCE_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Tested relay image: \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/ricardomartins-gravitee/openmaskit-companion
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  package:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: '0.13.1'
      - run: uv sync --frozen --python 3.12 --group dev --group bundle
      - name: Build development download
        env:
          RELAY_IMAGE: ${{ needs.publish.outputs.image }}
        run: uv run --frozen python scripts/bundle.py --image "$env:RELAY_IMAGE"
        if: runner.os == 'Windows'
      - name: Build development download
        env:
          RELAY_IMAGE: ${{ needs.publish.outputs.image }}
        run: uv run --frozen python scripts/bundle.py --image "$RELAY_IMAGE"
        if: runner.os != 'Windows'
      - name: Exercise the bundled connector
        run: uv run --frozen python scripts/test_bundle.py
      - name: Archive development downloads and checksums
        run: uv run --frozen python scripts/archive.py
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/downloads/*
      - uses: actions/upload-artifact@v4
        with:
          name: development-${{ matrix.os }}
          path: dist/downloads/*
          retention-days: 14
